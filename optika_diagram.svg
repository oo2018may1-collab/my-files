<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
    <style>
      .thin { stroke: #111; stroke-width: 2; fill: none; }
      .bold { stroke: #111; stroke-width: 4; fill: none; }
      .text { font: 20px Arial; fill: #111; }
      .small { font: 18px Arial; fill: #111; }
      .label { font: 15px Arial; fill: #333; }
    </style>
  </defs>

  <!-- Collecting lens -->
  <g transform="translate(0,0)">
    <line x1="90" y1="180" x2="710" y2="180" class="thin"/>
    <line x1="90" y1="180" x2="710" y2="180" stroke-dasharray="6 6" class="thin"/>
    <path d="M355 80 L355 280" class="bold"/>
    <path d="M445 80 L445 280" class="bold"/>
    <path d="M355 80 Q395 100 445 80" class="bold"/>
    <path d="M355 280 Q395 260 445 280" class="bold"/>
    <line x1="50" y1="180" x2="180" y2="180" class="thin" marker-end="url(#arrow)"/>
    <line x1="180" y1="180" x2="355" y2="180" class="thin" marker-end="url(#arrow)"/>
    <path d="M180 180 L355 100" class="thin" marker-end="url(#arrow)"/>
    <path d="M180 180 L355 260" class="thin" marker-end="url(#arrow)"/>
    <line x1="355" y1="180" x2="520" y2="180" class="thin" marker-end="url(#arrow)"/>
    <text x="250" y="145" class="small">object</text>
    <text x="520" y="145" class="small">image</text>
    <text x="315" y="355" class="text">Collecting lens</text>
  </g>

  <!-- Prism -->
  <g transform="translate(0,220)">
    <path d="M120 60 L220 220 L420 220 L320 60 Z" class="bold"/>
    <line x1="120" y1="60" x2="200" y2="80" class="thin" marker-end="url(#arrow)"/>
    <line x1="200" y1="80" x2="300" y2="160" class="thin" marker-end="url(#arrow)"/>
    <line x1="300" y1="160" x2="370" y2="150" class="thin" marker-end="url(#arrow)"/>
    <line x1="300" y1="160" x2="350" y2="120" class="thin" marker-end="url(#arrow)"/>
    <line x1="300" y1="160" x2="210" y2="200" class="thin"/>
    <text x="250" y="260" class="text">Prism</text>
  </g>

  <!-- Critical angle -->
  <g transform="translate(440,0)">
    <line x1="20" y1="120" x2="300" y2="120" class="thin"/>
    <path d="M20 120 L150 80" class="bold" marker-end="url(#arrow)"/>
    <path d="M150 80 L280 120" class="thin" marker-end="url(#arrow)"/>
    <path d="M150 80 L280 40" class="thin" marker-end="url(#arrow)"/>
    <circle cx="150" cy="120" r="4" fill="#111"/>
    <text x="90" y="150" class="small">critical angle</text>
    <text x="60" y="90" class="label">n1 &gt; n2</text>
    <text x="135" y="105" class="label">A</text>
    <text x="185" y="150" class="label">reflected</text>
  </g>

</svg>
